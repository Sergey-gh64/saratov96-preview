name: Saratov 96 Snapshot QA

on:
  pull_request:
    branches:
      - main
    paths:
      - "source/saratov96-mobile/**"
      - "source/SOURCE_COMMIT"
      - ".github/workflows/saratov96-snapshot-qa.yml"

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "4.7.2-stable"
  PROJECT_DIR: "source/saratov96-mobile"

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Verify repository-native assets
        run: |
          set -euxo pipefail
          test -s "$PROJECT_DIR/assets/legacy/courtyard_clean.webp"
          test -s "$PROJECT_DIR/assets/legacy/characters.webp"
          test -s "$PROJECT_DIR/assets/audio/music_30s.mp3"
          test "$(wc -c < "$PROJECT_DIR/assets/legacy/courtyard_clean.webp")" -gt 100000
          test "$(wc -c < "$PROJECT_DIR/assets/legacy/characters.webp")" -gt 100000
          test "$(wc -c < "$PROJECT_DIR/assets/audio/music_30s.mp3")" -gt 80000

      - name: Install Godot runtime dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl unzip \
            libfontconfig1 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libgl1 libasound2t64

      - name: Install pinned Godot
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl -LfsS \
            "https://godot-releases.nbg1.your-objectstorage.com/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/godot/godot" --version

      - name: Install Web export templates only
        run: |
          set -euxo pipefail
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR"
          python3 -m pip install --quiet remotezip
          TEMPLATE_DIR="$TEMPLATE_DIR" GODOT_RELEASE="$GODOT_RELEASE" python3 - <<'PY'
          import os
          from pathlib import Path
          from remotezip import RemoteZip
          release = os.environ["GODOT_RELEASE"]
          out = Path(os.environ["TEMPLATE_DIR"])
          url = f"https://godot-releases.nbg1.your-objectstorage.com/{release}/Godot_v{release}_export_templates.tpz"
          with RemoteZip(url) as archive:
              for name in ("templates/web_nothreads_release.zip","templates/web_nothreads_debug.zip","templates/version.txt"):
                  (out / Path(name).name).write_bytes(archive.read(name))
          PY

      - name: Godot import and smoke
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail
          godot --headless --path . --editor --quit
          godot --headless --path . res://tests/smoke_test.tscn

      - name: Stamp QA source commit
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          SOURCE_SHA="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/source/SOURCE_COMMIT")"
          SOURCE_SHA="$SOURCE_SHA" python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path("scripts/build_info.gd")
          s = p.read_text()
          s = s.replace('const BUILD_COMMIT: String = "dev"', f'const BUILD_COMMIT: String = "{os.environ["SOURCE_SHA"]}"')
          p.write_text(s)
          PY

      - name: Export Web
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail
          rm -rf build/web
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          python3 tools/prepare_web_release.py build/web "$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/source/SOURCE_COMMIT")" "visual-audio-qa.${GITHUB_RUN_NUMBER}"
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck

      - name: Mobile browser QA
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euxo pipefail
          npm install --no-save --package-lock=false puppeteer-core@24
          python3 -m http.server 4173 --directory build/web > "$RUNNER_TEMP/http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 0.25
          done
          S96_BASE_URL=http://127.0.0.1:4173/ node tests/browser_smoke.mjs

      - name: Upload QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: saratov96-visual-audio-qa
          path: |
            ${{ env.PROJECT_DIR }}/build/web
            ${{ env.PROJECT_DIR }}/browser-qa
          if-no-files-found: error
          retention-days: 5
