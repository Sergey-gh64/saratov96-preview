name: Runtime diagnostics
# verify-live: audio-toggle-gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/runtime-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install Puppeteer Core
        run: npm install puppeteer-core@24

      - name: Capture real Godot frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          cat > diagnose.mjs <<'EOF'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';

          const chrome = '/usr/bin/google-chrome';

          async function diagnose(name, url) {
            const lines = [];
            const browser = await puppeteer.launch({
              executablePath: chrome,
              headless: true,
              args: [
                '--no-sandbox',
                '--disable-dev-shm-usage',
                '--enable-unsafe-swiftshader',
                '--ignore-gpu-blocklist',
                '--window-size=430,932',
              ],
            });
            try {
              const page = await browser.newPage();
              await page.setViewport({ width: 430, height: 932, deviceScaleFactor: 1 });
              await page.evaluateOnNewDocument(() => {
                window.__s96Audio = { resumes: 0, starts: 0, mediaPlays: 0 };
                const AC = window.AudioContext || window.webkitAudioContext;
                if (AC && AC.prototype) {
                  const resume = AC.prototype.resume;
                  if (resume) {
                    AC.prototype.resume = function(...args) {
                      window.__s96Audio.resumes++;
                      window.__s96Audio.lastContext = this;
                      return resume.apply(this, args);
                    };
                  }
                  const createBufferSource = AC.prototype.createBufferSource;
                  if (createBufferSource) {
                    AC.prototype.createBufferSource = function(...args) {
                      const node = createBufferSource.apply(this, args);
                      const start = node.start?.bind(node);
                      if (start) {
                        node.start = (...startArgs) => {
                          window.__s96Audio.starts++;
                          return start(...startArgs);
                        };
                      }
                      return node;
                    };
                  }
                }
                const mediaPlay = HTMLMediaElement.prototype.play;
                HTMLMediaElement.prototype.play = function(...args) {
                  window.__s96Audio.mediaPlays++;
                  return mediaPlay.apply(this, args);
                };
              });
              page.on('console', msg => lines.push('CONSOLE '+msg.type()+': '+msg.text()));
              page.on('pageerror', err => lines.push('PAGEERROR: '+err.stack));
              page.on('requestfailed', req => lines.push('REQUESTFAILED: '+req.url()+' '+req.failure()?.errorText));

              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 90000 });

              let overlayRemoved = false;
              try {
                await page.waitForFunction(() => {
                  const status = document.getElementById('status');
                  return !status || !document.body.contains(status);
                }, { timeout: 90000 });
                overlayRemoved = true;
              } catch (e) {
                lines.push('WAIT_ERROR: Godot status overlay was not removed within 90s');
              }

              await new Promise(r => setTimeout(r, 3000));

              const state = await page.evaluate(() => {
                const canvas = document.getElementById('canvas');
                const link = document.querySelector('.s96-level-link');
                const audio = window.__s96Audio || {};
                return {
                  title: document.title,
                  overlayPresent: !!document.getElementById('status'),
                  canvasWidth: canvas?.width ?? null,
                  canvasHeight: canvas?.height ?? null,
                  clientWidth: canvas?.clientWidth ?? null,
                  clientHeight: canvas?.clientHeight ?? null,
                  navText: link?.textContent ?? null,
                  navHref: link?.getAttribute('href') ?? null,
                  audioBefore: {
                    resumes: audio.resumes || 0,
                    starts: audio.starts || 0,
                    mediaPlays: audio.mediaPlays || 0,
                    contextState: audio.lastContext?.state || null,
                  },
                };
              });
              state.overlayRemoved = overlayRemoved;

              if (name === 'level1' && overlayRemoved) {
                await page.mouse.click(60, 243);
                await new Promise(r => setTimeout(r, 2500));
                state.audioAfter = await page.evaluate(() => {
                  const audio = window.__s96Audio || {};
                  return {
                    resumes: audio.resumes || 0,
                    starts: audio.starts || 0,
                    mediaPlays: audio.mediaPlays || 0,
                    contextState: audio.lastContext?.state || null,
                  };
                });
              }

              await page.screenshot({ path: 'diagnostics/'+name+'.png', fullPage: true });
              fs.writeFileSync('diagnostics/'+name+'.json', JSON.stringify(state, null, 2));
              fs.writeFileSync('diagnostics/'+name+'.log', lines.join('\n'));
              console.log(name, JSON.stringify(state));
            } finally {
              await browser.close();
            }
          }

          await diagnose('level1', 'https://sergey-gh64.github.io/saratov96-preview/');
          await diagnose('level2', 'https://sergey-gh64.github.io/saratov96-preview/school/');
          EOF

          node diagnose.mjs
          echo "--- level1 state ---"
          cat diagnostics/level1.json
          echo "--- level1 errors ---"
          cat diagnostics/level1.log || true
          echo "--- level2 state ---"
          cat diagnostics/level2.json
          echo "--- level2 errors ---"
          cat diagnostics/level2.log || true

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: saratov96-runtime-diagnostics
          path: diagnostics
