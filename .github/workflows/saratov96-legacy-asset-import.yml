name: Saratov 96 Legacy Asset Import

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/saratov96-legacy-asset-import.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch legacy source bundle
        run: |
          set -euxo pipefail
          curl -LfsS "https://d2ol7oe51mr4n9.cloudfront.net/user_3II1gkf7C7iXTGeOiry0vpOPn3t/3be3ece2-4d3b-43a6-92fa-8180ce6834cb.zip" -o legacy.zip
          mkdir -p legacy
          unzip -q legacy.zip -d legacy
          find legacy -type f | sort
      - name: Collect graphics and audio
        run: |
          set -euxo pipefail
          mkdir -p extracted-assets
          find legacy -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.mp3' -o -iname '*.wav' -o -iname '*.ogg' \) -print0 |
            while IFS= read -r -d '' f; do
              rel="${f#legacy/}"
              mkdir -p "extracted-assets/$(dirname "$rel")"
              cp "$f" "extracted-assets/$rel"
            done
          find extracted-assets -type f -printf '%p %s bytes\n' | sort
          test "$(find extracted-assets -type f | wc -l)" -gt 0
      - name: Commit assets into release source snapshot
        run: |
          set -euxo pipefail
          rm -rf source/saratov96-mobile/assets/legacy source/saratov96-mobile/assets/audio
          mkdir -p source/saratov96-mobile/assets/legacy source/saratov96-mobile/assets/audio
          cp extracted-assets/s96web/assets/courtyard_clean.webp source/saratov96-mobile/assets/legacy/
          cp extracted-assets/s96web/assets/characters.webp source/saratov96-mobile/assets/legacy/
          cp extracted-assets/s96web/assets/hud.webp source/saratov96-mobile/assets/legacy/
          cp extracted-assets/s96web/assets/audio/*.mp3 source/saratov96-mobile/assets/audio/
          git config user.name "Saratov 96 Asset Import"
          git config user.email "saratov96-assets@users.noreply.github.com"
          git add source/saratov96-mobile/assets
          if ! git diff --cached --quiet; then
            git commit -m "Import Saratov 96 visual and audio assets"
            git push
          fi
      - name: Upload imported assets
        uses: actions/upload-artifact@v4
        with:
          name: saratov96-legacy-assets
          path: extracted-assets
          if-no-files-found: error
          retention-days: 3
      - name: Collect source reference
        run: |
          set -euxo pipefail
          mkdir -p extracted-source
          find legacy -type f \( -iname '*.gd' -o -iname '*.tscn' -o -name 'project.godot' -o -name 'export_presets.cfg' \) -print0 |
            while IFS= read -r -d '' f; do
              rel="${f#legacy/}"
              mkdir -p "extracted-source/$(dirname "$rel")"
              cp "$f" "extracted-source/$rel"
            done
          find extracted-source -type f -printf '%p %s bytes\n' | sort
      - name: Upload source reference
        uses: actions/upload-artifact@v4
        with:
          name: saratov96-legacy-source-reference
          path: extracted-source
          if-no-files-found: error
          retention-days: 3
